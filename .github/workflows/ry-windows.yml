# Fork-only pipeline (RyQuantum/EcoPaste): test, build a signed Windows x64 NSIS installer,
# and publish it with latest.json to this fork's GitHub Releases so the in-app updater
# (pointed at releases/latest/download/latest.json) offers it.
#
# Version: <upstream patch + 1>-ry.<run number>, see scripts/ry/version.ts.
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (fork's own updater key;
# its public half is plugins.updater.pubkey in src-tauri/tauri.conf.json).
# Tags are created with GITHUB_TOKEN, which does not trigger the upstream tag-based release.yml.
name: RY Windows build

on:
  push:
    branches: [ry-fixes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ry-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set; updater artifacts cannot be signed."
            exit 1
          fi

      - name: Apply fork version
        id: version
        run: pnpm tsx scripts/ry/version.ts

      - run: pnpm build:icon
        env:
          PLATFORM: windows-latest

      - name: Frontend lint
        run: pnpm lint

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust test
        working-directory: src-tauri
        run: cargo test --all-targets --all-features

      - name: Build
        shell: bash
        env:
          CI: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v*-ry.*' 2>/dev/null || true)"
          range="${previous:-origin/master}..HEAD"
          {
            echo "Fork build of ${GITHUB_SHA::7}. Changes since ${previous:-upstream master}:"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
          } > release-notes.md
          cat release-notes.md

      - name: Generate latest.json (verifies installer signature)
        run: >-
          pnpm tsx scripts/ry/latestJson.ts
          ${{ steps.version.outputs.version }}
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          ${{ github.repository }}
          release-notes.md
          latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ecopaste-windows-x64-nsis
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            latest.json
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/ry-fixes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bundle=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest \
            "$bundle"/*-setup.exe \
            "$bundle"/*-setup.exe.sig \
            latest.json
