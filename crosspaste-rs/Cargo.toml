[package]
name = "crosspaste-rs"
version = "0.1.0"
description = "Minimal Rust implementation of the CrossPaste LAN sync protocol (SyncApi v3, pairing v2)."
license = "AGPL-3.0-only"
repository = "https://github.com/RyQuantum/EcoPaste"
publish = false
edition = "2021"

[lib]
name = "crosspaste_rs"
path = "src/lib.rs"

[[bin]]
name = "cprs"
path = "src/bin/cprs.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
thiserror = "2"
anyhow = "1"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
reqwest = { version = "0.13", default-features = false }
mdns-sd = "0.13"
if-addrs = "0.13"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
